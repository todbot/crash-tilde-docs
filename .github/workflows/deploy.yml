name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to tilde.crashspace.org"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install mkdocs mkdocs-terminal

      - name: Build site
        run: mkdocs build

      - name: Test SSH connection
        if: ${{ inputs.deploy == true }}
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@tilde.crashspace.org echo "SSH OK"

      - name: Deploy via rsync
        if: ${{ inputs.deploy == true }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H tilde.crashspace.org >> ~/.ssh/known_hosts
          rsync -avz --delete --exclude='_generated/' -e 'ssh -i ~/.ssh/id_rsa' site/ ${{ secrets.DEPLOY_USER }}@tilde.crashspace.org:/var/www/tilde.crashspace.org/html/
